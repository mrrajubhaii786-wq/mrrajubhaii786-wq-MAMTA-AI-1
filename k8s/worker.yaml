apiVersion: apps/v1
kind: Deployment
metadata:
  name: mamta-worker
  labels:
    app: mamta-worker
spec:
  replicas: 5
  selector:
    matchLabels:
      app: mamta-worker
  template:
    metadata:
      labels:
        app: mamta-worker
    spec:
      containers:
        - name: worker
          image: mamta-worker:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: REDIS_URL
              value: "redis://redis-service:6379"
            - name: REDIS_HOST
              value: "redis-service"
            - name: REDIS_PORT
              value: "6379"
            - name: NODE_ENV
              value: "production"
          resources:
            limits:
              cpu: "1000m"
              memory: "1024Mi"
            requests:
              cpu: "500m"
              memory: "512Mi"
