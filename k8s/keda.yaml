apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: mamta-scaler
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mamta-worker
  minReplicaCount: 1
  maxReplicaCount: 50
  cooldownPeriod: 300
  restoreToOriginalReplicaCount: false
  triggers:
    - type: redis
      metadata:
        address: redis-service:6379
        listName: bull:mamta-ai:wait
        listLength: "5"
